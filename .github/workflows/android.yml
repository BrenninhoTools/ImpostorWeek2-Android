name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install Haxe libraries
        run: |
          haxelib install lime 8.3.2 --quiet --never --skip-dependencies
          haxelib install openfl 9.5.2 --quiet --never --skip-dependencies
          haxelib install flixel 6.2.0 --quiet --never --skip-dependencies
          haxelib install flixel-addons 4.0.2 --quiet --never --skip-dependencies
          haxelib install flixel-ui 2.6.5 --quiet --never --skip-dependencies
          haxelib install hscript 2.7.0 --quiet --never --skip-dependencies
          haxelib install actuate 1.9.0 --quiet --never --skip-dependencies
          haxelib install hxvlc 2.3.1 --quiet --never --skip-dependencies
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp.git --quiet --never --skip-dependencies
          haxelib run lime rebuild hxcpp
          haxelib list

      - name: Configure Android environment
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Build APK
        run: haxelib run lime build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImpostorWeek2-Android
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
