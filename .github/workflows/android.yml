name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXELIB_PATH: /home/runner/haxelib
  HXCPP_COMPILE_CACHE: /home/runner/hxcpp_cache
  HXCPP_COMPILE_THREADS: 4
  HXCPP_CACHE_MB: 4096

jobs:
  android:
    name: Android (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Restore Haxe libraries
        id: haxelib-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HAXELIB_PATH }}
          key: haxelib-${{ runner.os }}-${{ hashFiles('.github/workflows/android.yml') }}

      - name: Install Haxe libraries
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HAXELIB_PATH
          haxelib setup $HAXELIB_PATH
          haxelib install lime 8.3.2 --quiet --never --skip-dependencies
          haxelib install openfl 9.5.2 --quiet --never --skip-dependencies
          haxelib install flixel 6.2.0 --quiet --never --skip-dependencies
          haxelib install flixel-addons 4.0.2 --quiet --never --skip-dependencies
          haxelib install flixel-ui 2.6.5 --quiet --never --skip-dependencies
          haxelib install hscript 2.7.0 --quiet --never --skip-dependencies
          haxelib install actuate 1.9.0 --quiet --never --skip-dependencies
          haxelib install hxvlc 2.3.1 --quiet --never --skip-dependencies
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp.git --quiet --never --skip-dependencies
          haxelib run lime rebuild hxcpp

      - name: Save Haxe libraries
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HAXELIB_PATH }}
          key: ${{ steps.haxelib-cache.outputs.cache-primary-key }}

      - name: Use cached Haxe libraries
        if: steps.haxelib-cache.outputs.cache-hit == 'true'
        run: haxelib setup $HAXELIB_PATH

      - name: Restore hxcpp compile cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HXCPP_COMPILE_CACHE }}
          key: hxcpp-android-arm64-${{ github.run_id }}
          restore-keys: hxcpp-android-arm64-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Project.xml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure Android environment
        run: |
          mkdir -p $HXCPP_COMPILE_CACHE
          find $HXCPP_COMPILE_CACHE -name "*.pch" -delete
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Build APK
        run: haxelib run lime build android

      - name: Save hxcpp compile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HXCPP_COMPILE_CACHE }}
          key: hxcpp-android-arm64-${{ github.run_id }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImpostorWeek2-Android-ARM64
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
